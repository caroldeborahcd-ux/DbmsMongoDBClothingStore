<title>Threads & Co — ER Diagram</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0e0c; font-family: 'Georgia', serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
  h1 { color: #c9a96e; font-size: 28px; font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 6px; text-align: center; }
  .subtitle { color: rgba(248,244,239,0.4); font-size: 12px; letter-spacing: 0.15em; margin-bottom: 40px; text-align: center; font-family: sans-serif; }

  .legend { display: flex; gap: 32px; margin-top: 32px; flex-wrap: wrap; justify-content: center; }
  .legend-item { display: flex; align-items: center; gap: 8px; color: rgba(248,244,239,0.6); font-size: 12px; font-family: sans-serif; }
  .legend-dot { width: 14px; height: 14px; border-radius: 2px; flex-shrink: 0; }
</style>

<body>

<h1>Threads & Co</h1>
<div class="subtitle">Entity Relationship Diagram — MongoDB Collections</div>

<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" style="width:1200px; max-width:100%;">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c9a96e" opacity="0.7"/>
    </marker>
    <marker id="arr-many" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto">
      <path d="M0,5 L5,2 M0,5 L5,8" stroke="#c9a96e" stroke-width="1.5" fill="none" opacity="0.7"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1c18"/>
      <stop offset="100%" stop-color="#171511"/>
    </linearGradient>
    <linearGradient id="headerGrad-user" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2d1f4e"/>
      <stop offset="100%" stop-color="#1e1630"/>
    </linearGradient>
    <linearGradient id="headerGrad-product" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a3a2a"/>
      <stop offset="100%" stop-color="#112519"/>
    </linearGradient>
    <linearGradient id="headerGrad-category" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a2a10"/>
      <stop offset="100%" stop-color="#251b08"/>
    </linearGradient>
    <linearGradient id="headerGrad-order" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a2a3a"/>
      <stop offset="100%" stop-color="#0f1e2d"/>
    </linearGradient>
    <linearGradient id="headerGrad-cart" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a1a1a"/>
      <stop offset="100%" stop-color="#250f0f"/>
    </linearGradient>
    <linearGradient id="headerGrad-review" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a3a3a"/>
      <stop offset="100%" stop-color="#0f2525"/>

  </defs>

  <!-- Background decorative grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(201,169,110,0.04)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <line x1="240" y1="220" x2="240" y2="640" stroke="#c9a96e" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5" marker-end="url(#arr)"/>
  <!-- User → Order (1:N) -->
  <line x1="260" y1="220" x2="680" y2="460" stroke="#c9a96e" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5" marker-end="url(#arr)"/>
  <!-- User → Review (1:N) -->
  <line x1="280" y1="220" x2="900" y2="560" stroke="#c9a96e" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5" marker-end="url(#arr)"/>

  <!-- Product → Category (N:1) -->
  <line x1="640" y1="200" x2="830" y2="200" stroke="#c9a96e" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5" marker-end="url(#arr)"/>
  <!-- Product → Cart Items (embedded) -->
  <line x1="600" y1="270" x2="320" y2="680" stroke="#c9a96e" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5" marker-end="url(#arr)"/>
  <!-- Product → Order Items (embedded) -->
  <line x1="630" y1="270" x2="720" y2="460" stroke="#c9a96e" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5" marker-end="url(#arr)"/>
  <!-- Product → Review (1:N) -->
  <line x1="640" y1="250" x2="900" y2="580" stroke="#c9a96e" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5" marker-end="url(#arr)"/>

  <!-- Category → itself (parent) -->
  <path d="M 990 170 Q 1060 140 1060 200 Q 1060 230 990 230" fill="none" stroke="#c9a96e" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4" marker-end="url(#arr)"/>

  <!-- Order → Review -->
  <line x1="860" y1="530" x2="900" y2="570" stroke="#c9a96e" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.35" marker-end="url(#arr)"/>

  <!-- ============ CARDINALITY LABELS ============ -->
  <text x="216" y="430" fill="#c9a96e" font-size="11" font-family="sans-serif" opacity="0.8">1</text>
  <text x="216" y="650" fill="#c9a96e" font-size="11" font-family="sans-serif" opacity="0.8">1</text>
  <text x="360" y="340" fill="#c9a96e" font-size="11" font-family="sans-serif" opacity="0.8">1</text>
  <text x="690" y="455" fill="#c9a96e" font-size="11" font-family="sans-serif" opacity="0.8">N</text>
  <text x="650" y="200" fill="#c9a96e" font-size="11" font-family="sans-serif" opacity="0.8">N</text>
  <text x="820" y="195" fill="#c9a96e" font-size="11" font-family="sans-serif" opacity="0.8">1</text>

  <!-- ============ TABLE: USERS ============ -->
  <g transform="translate(80, 60)">
    <rect width="300" height="310" rx="4" fill="url(#cardGrad)" stroke="#2d1f4e" stroke-width="1.5"/>

    <rect width="300" height="44" rx="4" fill="url(#headerGrad-user)"/>
    <rect y="34" width="300" height="10" fill="url(#headerGrad-user)"/>
    <text x="16" y="18" fill="#b39ddb" font-size="11" font-family="sans-serif" font-weight="700" letter-spacing="2">COLLECTION</text>

      <text x="14" y="200" fill="#e8f4e8">  address</text>
      <text x="160" y="200" fill="rgba(248,244,239,0.35)" font-size="11">Object (embedded)</text>
      <text x="14" y="222" fill="#e8f4e8">  wishlist</text>
      <text x="160" y="222" fill="rgba(248,244,239,0.35)" font-size="11">[Product refs]</text>
      <text x="14" y="244" fill="#e8f4e8">  isActive</text>
      <text x="160" y="244" fill="rgba(248,244,239,0.35)" font-size="11">Boolean</text>
      <text x="14" y="268" fill="rgba(248,244,239,0.3)">  createdAt</text>
      <text x="160" y="268" fill="rgba(248,244,239,0.25)" font-size="11">Date (auto)</text>
      <text x="14" y="290" fill="rgba(248,244,239,0.3)">  updatedAt</text>
      <text x="160" y="290" fill="rgba(248,244,239,0.25)" font-size="11">Date (auto)</text>
    </g>
    <line x1="0" y1="72" x2="300" y2="72" stroke="rgba(201,169,110,0.15)" stroke-width="1"/>
  </g>

  <!-- ============ TABLE: PRODUCTS ============ -->

    </g>
    <line x1="0" y1="72" x2="320" y2="72" stroke="rgba(201,169,110,0.15)" stroke-width="1"/>
